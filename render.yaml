services:
  - type: web
    name: hexagonal-api
    runtime: java
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/hexagonal-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hexagonal-db
          property: connectionString

databases:
  - name: hexagonal-db
    plan: free
